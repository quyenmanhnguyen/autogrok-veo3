    function makeRow(id, labelText, options, defaultVal, onChange) {
        if (document.getElementById(id)) return null;

        container.appendChild(lbl);

    function getActiveTab() {
        var tabs = document.querySelectorAll('[class*="tab-btn"], [class*="TabButton"], .tab-button, button');

            if (txt.indexOf('video') >= 0 || txt.indexOf('veo') >= 0) return 'video';

        if (!aspectLabel) return;
        var aspectParent = aspectLabel.closest('div') || aspectLabel.parentElement;

        var tab = getActiveTab();
        var imgC = document.getElementById('image-count-container');
        var vidC = document.getElementById('video-count-container');
        var isImg = (tab === 'image' || tab === 'refimg');

        var api = window.electronAPI;
        if (api.image && api.image.generate && !api.image._origGenerate) {

s.innerHTML='<span>\u2705 <b id="ag-s-done">0</b></span><span>\u274C <b id="ag-s-err">0</b></span><span>\u{1F504} <b id="ag-s-run">0</b></span><span>\u23F3 <b id="ag-s-wait">0</b></span><span style="flex:1"></span><button class="ag-clear-btn" id="ag-clear-btn" title="X\u00F3a l\u1ECBch s\u1EED">\u{1F5D1}</button><button class="ag-cancel-btn" id="ag-cancel-btn" title="D\u1EEBng t\u1EA5t c\u1EA3">\u26D4 D\u1EEBng</button>';
panel.appendChild(h);panel.appendChild(b);panel.appendChild(s);
document.body.appendChild(panel);
h.onclick=function(e){if(e.target.closest('.ag-cancel-btn')||e.target.closest('.ag-x-btn')||e.target.closest('.ag-clear-btn'))return;collapsed=!collapsed;panel.classList.toggle('collapsed',collapsed)};
document.getElementById('ag-cancel-btn').onclick=function(e){e.stopPropagation();cancelAll()};
document.getElementById('ag-clear-btn').onclick=function(e){e.stopPropagation();clearHistory()};
b.onclick=function(e){var btn=e.target.closest('.ag-x-btn');if(!btn)return;e.stopPropagation();var k=btn.getAttribute('data-jk');if(k)cancelJob(k)};
}
function cancelJob(key){
var j=jobs.get(key);
if(!j||j.st==='done'||j.st==='error')return;
j.st='error';j.err='D\u1EEBng b\u1EDFi ng\u01B0\u1EDDi d\u00F9ng';if(!j.t1)j.t1=Date.now();
cancelledKeys.add(key);
render();
}
function cancelAll(){
if(!window.electronAPI)return;
var api=window.electronAPI;
if(api.image&&api.image.cancel)api.image.cancel();
if(api.video&&api.video.cancel)api.video.cancel();
if(api.i2v&&api.i2v.cancel)api.i2v.cancel();
if(api.refimg&&api.refimg.cancel)api.refimg.cancel();
for(var e of jobs.entries()){var k=e[0],j=e[1];
if(j.st==='running'||j.st==='pending'){j.st='error';j.err='D\u1EEBng b\u1EDFi ng\u01B0\u1EDDi d\u00F9ng';if(!j.t1)j.t1=Date.now();cancelledKeys.add(k)}
}
render();
}
function clearHistory(){
// Remove only completed (done/error) jobs, keep running/pending
var toRemove=[];
for(var e of jobs.entries()){if(e[1].st==='done'||e[1].st==='error')toRemove.push(e[0])}
toRemove.forEach(function(k){jobs.delete(k)});
cancelledKeys.clear();
render();
}
function newB(t){bc++;cBid='B'+bc;cBtype=t;}
function onProg(ev){
if(!ev||!ev.jobId)return;
var t=ev.jobId,d=ev.progress||{},gi=d.globalIdx!=null?d.globalIdx:0;
var bb=d.batchId||null;
// Always create new batch when batchId changes or new job type
if(bb&&bb!==cBid){cBid=bb;cBtype=t;bc++}
else if(!cBid){newB(t)}
else if(t!==cBtype){newB(t)}
else if(gi===0&&!bb){var ex=jobs.get(cBid+':'+t+':0');if(ex&&(ex.st==='done'||ex.st==='error'))newB(t)}
var k=cBid+':'+t+':'+gi;
if(cancelledKeys.has(k))return;
if(!jobs.has(k))jobs.set(k,{bid:cBid,type:t,gi:gi,pr:getPr(d),pct:0,st:'pending',err:null,t0:Date.now(),t1:null,key:k,seq:Date.now()+Math.random()});
var j=jobs.get(k);
var p=typeof d.progress==='number'?d.progress:j.pct;
j.pct=Math.max(j.pct,p);
if(d.prompt&&typeof d.prompt==='string')j.pr=d.prompt;
if(d.result){j.st=d.result.success?'done':'error';j.pct=100;if(d.result.error)j.err=d.result.error;if(d.result.title)j.pr=d.result.title;if(!j.t1)j.t1=Date.now()}
else if(p>0&&p<100)j.st='running';
else if(p>=100){if(j.st!=='error')j.st='done';if(!j.t1)j.t1=Date.now()}
else if(j.st==='pending')j.st='running';
render();
}
function getPr(d){if(typeof d.prompt==='string')return d.prompt;if(d.item&&d.item.prompt)return d.item.prompt;if(d.item&&d.item.imagePath)return d.item.imagePath.split(/[\\\/]/).pop();return ''}
function ft(ms){if(!ms||ms<=0)return'';var s=Math.round(ms/1000);if(s<60)return s+'s';return Math.floor(s/60)+'m'+(s%60>0?(s%60)+'s':'')}
var TL={image:'\u{1F5BC}\uFE0F Img',video:'\u{1F3AC} Vid',i2v:'\u{1F4F8} I2V',refimg:'\u{1F3A8} Ref'};
var TI={image:'\u{1F5BC}',video:'\u{1F3AC}',i2v:'\u{1F4F8}',refimg:'\u{1F3A8}'};
var SI={pending:'\u23F3',running:'\u{1F504}',done:'\u2705',error:'\u274C'};
function render(){
mkPanel();var body=document.getElementById('ag-tracker-body');if(!body)return;
// Compute cumulative per-type number based on insertion order (seq).
// This way #1, #2, #3... continue across batches of the same type.
var _byType={};for(var _j of jobs.values()){if(!_byType[_j.type])_byType[_j.type]=[];_byType[_j.type].push(_j)}
for(var _t in _byType){_byType[_t].sort(function(a,b){return a.seq-b.seq}).forEach(function(jj,ii){jj.absNum=ii+1})}
var bm=new Map();for(var j of jobs.values()){if(!bm.has(j.bid))bm.set(j.bid,[]);bm.get(j.bid).push(j)}
var dn=0,er=0,rn=0,wt=0,html='';
var bids=Array.from(bm.keys()).reverse();
for(var bi=0;bi<bids.length;bi++){
var bid=bids[bi],bj=bm.get(bid).sort(function(a,b){return a.gi-b.gi});
var bt=bj[0]?bj[0].type:'',lb=TL[bt]||bt,ic=bid===cBid;
var bd=bj.filter(function(x){return x.st==='done'}).length;
var be=bj.filter(function(x){return x.st==='error'}).length;
html+='<div style="padding:4px 14px;font-size:11px;color:#888;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;'+(ic?'background:rgba(0,229,255,.06)':'opacity:.65')+'"><span>'+lb+(ic?' <span style="color:#00e5ff">\u25CF LIVE</span>':'')+' </span><span style="font-size:10px">'+bd+'\u2705 '+be+'\u274C / '+bj.length+'</span></div>';
for(var ji=0;ji<bj.length;ji++){
var j=bj[ji],p=Math.min(100,Math.max(0,j.pct)),pr=(j.pr||'').substring(0,30),ti=TI[j.type]||'';
var el=j.st==='running'?ft(Date.now()-j.t0):(j.t1?ft(j.t1-j.t0):'');
var canCancel=(j.st==='running'||j.st==='pending');
var xBtn=canCancel?'<button class="ag-x-btn" data-jk="'+j.key+'" title="D\u1EEBng job n\u00E0y">\u00D7</button>':'<span style="width:18px"></span>';
html+='<div class="ag-job-row '+j.st+'" title="'+(j.err||j.pr||'').replace(/"/g,'&quot;').substring(0,300)+'">'
+'<span class="ag-idx">'+ti+'#'+(j.absNum||j.gi+1)+'</span>'
+'<span class="ag-prompt">'+pr+'</span>'
+'<span style="font-size:10px;color:'+(j.st==='running'?'#00e5ff':'#888')+';min-width:34px;text-align:right;font-weight:'+(j.st==='running'?'600':'400')+'">'+el+'</span>'
+'<span class="ag-bar-wrap"><span class="ag-bar-fill" style="width:'+p+'%"></span></span>'
+'<span class="ag-status">'+(SI[j.st]||'\u23F3')+'</span>'
+xBtn+'</div>';
if(j.st==='done')dn++;else if(j.st==='error')er++;else if(j.st==='running')rn++;else wt++;
}}
body.innerHTML=html;
var rr=body.querySelector('.ag-job-row.running');if(rr)rr.scrollIntoView({block:'nearest',behavior:'smooth'});
document.getElementById('ag-tracker-count').textContent=jobs.size;
document.getElementById('ag-s-done').textContent=dn;
document.getElementById('ag-s-err').textContent=er;
document.getElementById('ag-s-run').textContent=rn;
document.getElementById('ag-s-wait').textContent=wt;
var cb=document.getElementById('ag-cancel-btn');
if(cb)cb.style.display=(rn+wt)>0?'inline-block':'none';
panel.style.display=jobs.size>0?'flex':'none';
}
setInterval(function(){var hr=false;for(var j of jobs.values()){if(j.st==='running'){hr=true;break}}if(hr)render()},1000);
function hook(){if(!window.electronAPI)return false;if(window.__tH)return true;if(window.electronAPI.onProgress)window.electronAPI.onProgress(onProg);window.__tH=true;return true}
window.__trackerReset=function(){/* no-op: keep history, new batch auto-separates */};
var ha=0,hi=setInterval(function(){if(hook()||++ha>60)clearInterval(hi)},1000);
})();
</script>

<script>
// ===== PROMPT TEXTAREA AUTO-NEWLINE PATCH =====
// Fix: when user pastes (or types after focus) a new prompt at the end of
// an existing prompt list that doesn't end with a newline, the new prompt
// gets concatenated onto the last existing prompt because the textarea
// uses '\n' as the per-prompt separator. This patch auto-inserts a
// newline before pasted text so new prompts always start on their own
// line. Only triggers when pasting at the very end of non-empty content
// that doesn't already end with a newline — never modifies edits that
// happen in the middle of the textarea.
(function(){
  var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
  function applyValue(ta, v){
    nativeSetter.call(ta, v);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function fix(ta){
    if (ta.__pmFix) return;
    ta.__pmFix = true;
    ta.addEventListener('paste', function(e){
      var v = ta.value || '';
      var s = ta.selectionStart, en = ta.selectionEnd;
      // Only auto-prepend newline when caret is at end of non-empty content
      // and selection is collapsed (i.e. cursor at end, no replacement).
      if (s !== en) return;
      if (s !== v.length) return;
      if (!v) return;
      if (v.endsWith('\n')) return;
      var cd = e.clipboardData || window.clipboardData;
      if (!cd) return;
      var pasted = cd.getData('text');
      if (!pasted) return;
      e.preventDefault();
      // Insert a separator newline so the pasted block starts on a new line.
      // If the pasted text already starts with whitespace/newlines, normalise.
      var sep = pasted.startsWith('\n') ? '' : '\n';
      applyValue(ta, v + sep + pasted);
      // Move caret to end of pasted content.
      var newPos = (v + sep + pasted).length;
      ta.setSelectionRange(newPos, newPos);
    });
  }
  function scan(){
    // Match all prompt textareas (image, i2v, ref-fill all use .prompt-textarea).
    var tas = document.querySelectorAll('textarea.prompt-textarea');
    for (var i = 0; i < tas.length; i++) fix(tas[i]);
  }
  if (document.body) scan();
  document.addEventListener('DOMContentLoaded', scan);
  // React rerenders may swap textarea instances, so observe the tree.
  try {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  } catch (_) {}
})();
</script>
